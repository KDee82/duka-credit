<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TinaAi — Test Chat</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg:        #0b141a;
    --panel:     #111b21;
    --surface:   #202c33;
    --border:    #2a3942;
    --green:     #00a884;
    --sent:      #005c4b;
    --text:      #e9edef;
    --sub:       #8696a0;
    --danger:    #f15c6d;
    --radius:    8px;
  }

  html, body { height: 100%; overflow: hidden; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
         background: var(--bg); color: var(--text); display: flex; }

  /* ── Scrollbar ────────────────────────────────────── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* ── Sidebar ─────────────────────────────────────── */
  .sidebar {
    width: 320px; min-width: 320px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    overflow: hidden;
  }

  .sidebar-header {
    background: var(--surface);
    padding: 14px 16px;
    display: flex; align-items: center; gap: 12px;
    border-bottom: 1px solid var(--border);
  }
  .avatar {
    width: 42px; height: 42px; border-radius: 50%;
    background: var(--green);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700; color: #fff; flex-shrink: 0;
  }
  .sidebar-header h2 { font-size: 16px; font-weight: 600; }
  .sidebar-header p  { font-size: 12px; color: var(--sub); margin-top: 2px; }

  .provider-badge {
    margin-left: auto; padding: 3px 8px;
    border-radius: 12px; font-size: 11px; font-weight: 600;
    background: var(--green); color: #000; white-space: nowrap;
  }
  .provider-badge.claude { background: #7c4dff; color: #fff; }
  .provider-badge.none   { background: var(--danger); color: #fff; }

  .sidebar-body { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 16px; }

  .section { background: var(--surface); border-radius: var(--radius); overflow: hidden; }
  .section-title {
    padding: 10px 14px; font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .8px; color: var(--green);
    border-bottom: 1px solid var(--border);
  }
  .section-body { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }

  label { font-size: 12px; color: var(--sub); display: block; margin-bottom: 4px; }
  input[type=text] {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 10px;
    color: var(--text); font-size: 13px; outline: none;
    transition: border-color .15s;
  }
  input[type=text]:focus { border-color: var(--green); }

  .btn {
    border: none; border-radius: 6px; padding: 8px 14px;
    font-size: 13px; font-weight: 600; cursor: pointer;
    transition: opacity .15s; width: 100%;
  }
  .btn:hover { opacity: .85; }
  .btn-green  { background: var(--green);   color: #000; }
  .btn-red    { background: var(--danger);  color: #fff; }
  .btn-ghost  { background: var(--border);  color: var(--text); }
  .btn-row    { display: flex; gap: 8px; }
  .btn-row .btn { flex: 1; }

  .memory-block { font-size: 12px; color: var(--sub); line-height: 1.8; }
  .memory-block span { color: var(--text); }

  .notes-list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
  .notes-list li {
    background: var(--bg); border-radius: 6px; padding: 7px 10px;
    font-size: 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  .notes-list li span { flex: 1; color: var(--text); }
  .del-note { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 14px; padding: 0 4px; }

  /* ── Chat area ───────────────────────────────────── */
  .chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  .chat-header {
    background: var(--surface); padding: 10px 16px;
    display: flex; align-items: center; gap: 12px;
    border-bottom: 1px solid var(--border);
  }
  .chat-header .avatar { width: 38px; height: 38px; font-size: 17px; }
  .chat-header .info h3 { font-size: 15px; font-weight: 600; }
  .chat-header .info p  { font-size: 12px; color: var(--sub); }
  .chat-id-input {
    margin-left: auto; background: var(--bg);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 5px 10px; color: var(--sub); font-size: 12px; width: 130px; outline: none;
  }
  .chat-id-input:focus { border-color: var(--green); color: var(--text); }

  /* Messages */
  .messages {
    flex: 1; overflow-y: auto; padding: 16px 8%;
    display: flex; flex-direction: column; gap: 3px;
    background: var(--bg);
  }

  .msg { max-width: 68%; display: flex; flex-direction: column; }
  .msg.sent     { align-self: flex-end; }
  .msg.received { align-self: flex-start; }

  .bubble {
    padding: 7px 12px 20px; border-radius: var(--radius);
    position: relative; line-height: 1.5; font-size: 14px; word-wrap: break-word;
  }
  .sent     .bubble { background: var(--sent);    border-top-right-radius: 2px; }
  .received .bubble { background: var(--surface); border-top-left-radius: 2px; }

  .bubble-meta {
    position: absolute; bottom: 4px; right: 8px;
    display: flex; align-items: center; gap: 3px;
    font-size: 11px; color: var(--sub);
  }
  .ticks { color: var(--green); }

  /* Markdown inside bubbles */
  .bubble strong { font-weight: 700; }
  .bubble em     { font-style: italic; }
  .bubble code   {
    background: rgba(0,0,0,.35); border-radius: 4px;
    padding: 1px 5px; font-family: 'SF Mono', Consolas, monospace; font-size: 13px;
  }
  .bubble pre {
    background: rgba(0,0,0,.4); border-radius: 6px;
    padding: 10px 12px; margin-top: 4px; overflow-x: auto;
  }
  .bubble pre code { background: none; padding: 0; font-size: 12px; }

  /* Date divider */
  .date-divider {
    align-self: center; background: var(--surface);
    padding: 4px 12px; border-radius: 12px; font-size: 12px; color: var(--sub);
    margin: 8px 0;
  }

  /* Typing indicator */
  .typing .bubble {
    background: var(--surface); padding: 12px 16px 12px; border-top-left-radius: 2px;
  }
  .dots { display: flex; gap: 4px; align-items: center; height: 18px; }
  .dots span {
    width: 7px; height: 7px; border-radius: 50%; background: var(--sub);
    animation: bounce .9s infinite ease-in-out;
  }
  .dots span:nth-child(2) { animation-delay: .15s; }
  .dots span:nth-child(3) { animation-delay: .30s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: .5; }
    40%            { transform: translateY(-5px); opacity: 1; }
  }

  /* Quick commands */
  .commands {
    background: var(--surface); padding: 8px 12px;
    border-top: 1px solid var(--border);
    display: flex; gap: 6px; flex-wrap: wrap;
  }
  .cmd-chip {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 14px; padding: 4px 10px;
    font-size: 12px; color: var(--sub); cursor: pointer;
    transition: border-color .15s, color .15s;
  }
  .cmd-chip:hover { border-color: var(--green); color: var(--green); }

  /* Input */
  .input-area {
    background: var(--surface); padding: 10px 14px;
    display: flex; align-items: flex-end; gap: 10px;
    border-top: 1px solid var(--border);
  }
  #msg-input {
    flex: 1; background: var(--bg); border: 1px solid var(--border);
    border-radius: 20px; padding: 10px 16px;
    color: var(--text); font-size: 14px; outline: none;
    resize: none; max-height: 120px; overflow-y: auto; line-height: 1.4;
    transition: border-color .15s;
  }
  #msg-input:focus { border-color: var(--green); }
  #msg-input::placeholder { color: var(--sub); }

  .send-btn {
    width: 42px; height: 42px; border-radius: 50%;
    background: var(--green); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: background .15s;
  }
  .send-btn:hover { background: #00c49a; }
  .send-btn svg { width: 20px; height: 20px; fill: #fff; }

  /* Toast */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--surface); color: var(--text);
    padding: 10px 20px; border-radius: 8px; font-size: 13px;
    box-shadow: 0 4px 16px rgba(0,0,0,.4); pointer-events: none;
    opacity: 0; transition: opacity .2s; z-index: 99;
  }
  .toast.show { opacity: 1; }

  /* Empty state */
  .empty-state {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px;
    color: var(--sub); text-align: center; padding: 40px;
  }
  .empty-state .big { font-size: 48px; }
  .empty-state p { font-size: 14px; line-height: 1.6; }
</style>
</head>
<body>

<!-- ── SIDEBAR ─────────────────────────────────────────────────── -->
<aside class="sidebar">
  <div class="sidebar-header">
    <div class="avatar">T</div>
    <div>
      <h2>TinaAi</h2>
      <p>Test &amp; Configure</p>
    </div>
    <span class="provider-badge" id="providerBadge">—</span>
  </div>

  <div class="sidebar-body">

    <!-- Profile -->
    <div class="section">
      <div class="section-title">Profile</div>
      <div class="section-body">
        <div>
          <label>Name</label>
          <input type="text" id="cfgName" placeholder="Your name">
        </div>
        <div>
          <label>Shop</label>
          <input type="text" id="cfgShop" placeholder="Shop name">
        </div>
        <div>
          <label>Location</label>
          <input type="text" id="cfgLocation" placeholder="City / area">
        </div>
        <div>
          <label>Add note</label>
          <div style="display:flex;gap:6px">
            <input type="text" id="cfgNote" placeholder="Something to remember" style="flex:1">
            <button class="btn btn-green" style="width:auto;padding:8px 12px" onclick="addNote()">+</button>
          </div>
        </div>
        <button class="btn btn-green" onclick="saveProfile()">Save Profile</button>
      </div>
    </div>

    <!-- Notes -->
    <div class="section" id="notesSection" style="display:none">
      <div class="section-title">Notes</div>
      <div class="section-body">
        <ul class="notes-list" id="notesList"></ul>
      </div>
    </div>

    <!-- Memory info -->
    <div class="section" id="memorySection">
      <div class="section-title">Memory</div>
      <div class="section-body">
        <div class="memory-block" id="memoryBlock">No data yet.</div>
      </div>
    </div>

    <!-- Actions -->
    <div class="section">
      <div class="section-title">Actions</div>
      <div class="section-body">
        <div class="btn-row">
          <button class="btn btn-ghost" onclick="resetChat(false)">Clear History</button>
          <button class="btn btn-red"   onclick="resetChat(true)">Forget All</button>
        </div>
      </div>
    </div>

  </div>
</aside>

<!-- ── CHAT ────────────────────────────────────────────────────── -->
<main class="chat">
  <div class="chat-header">
    <div class="avatar">T</div>
    <div class="info">
      <h3>TinaAi</h3>
      <p id="statusLine">Intelligent assistant</p>
    </div>
    <input type="text" class="chat-id-input" id="chatIdInput" value="web-test" placeholder="Chat ID" title="Session ID">
  </div>

  <div class="messages" id="messages">
    <div class="empty-state" id="emptyState">
      <div class="big">🤖</div>
      <p>Send a message or use a command<br>to start chatting with TinaAi.</p>
    </div>
  </div>

  <div class="commands">
    <span class="cmd-chip" onclick="sendCommand('/start')">/start</span>
    <span class="cmd-chip" onclick="sendCommand('/help')">/help</span>
    <span class="cmd-chip" onclick="sendCommand('/memory')">/memory</span>
    <span class="cmd-chip" onclick="sendCommand('/reset')">/reset</span>
    <span class="cmd-chip" onclick="sendCommand('/forget')">/forget</span>
  </div>

  <div class="input-area">
    <textarea id="msg-input" rows="1" placeholder="Message TinaAi…"></textarea>
    <button class="send-btn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
    </button>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
  // ── State ────────────────────────────────────────────────────
  let chatId  = 'web-test';
  let sending = false;

  const messagesEl  = document.getElementById('messages');
  const inputEl     = document.getElementById('msg-input');
  const chatIdInput = document.getElementById('chat-id-input') || document.getElementById('chatIdInput');
  const emptyState  = document.getElementById('emptyState');

  // ── Helpers ──────────────────────────────────────────────────
  function esc(s) {
    return String(s)
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }

  function renderMarkdown(text) {
    return esc(text)
      // code blocks
      .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
      // inline code
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      // bold
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      // italic
      .replace(/\*(.+?)\*/g, '<em>$1</em>')
      // line breaks
      .replace(/\n/g, '<br>');
  }

  function formatTime(d = new Date()) {
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function showToast(msg, ms = 2500) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), ms);
  }

  function scrollBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function hideEmpty() {
    if (emptyState) emptyState.style.display = 'none';
  }

  // ── Append messages ──────────────────────────────────────────
  function appendMsg(text, side, time = new Date()) {
    hideEmpty();
    const wrapper = document.createElement('div');
    wrapper.className = `msg ${side}`;
    wrapper.innerHTML = `
      <div class="bubble">
        ${renderMarkdown(text)}
        <div class="bubble-meta">
          ${formatTime(time)}
          ${side === 'sent' ? '<span class="ticks">✓✓</span>' : ''}
        </div>
      </div>`;
    messagesEl.appendChild(wrapper);
    scrollBottom();
    return wrapper;
  }

  function showTyping() {
    hideEmpty();
    const el = document.createElement('div');
    el.className = 'msg received typing';
    el.id = 'typing';
    el.innerHTML = `<div class="bubble"><div class="dots"><span></span><span></span><span></span></div></div>`;
    messagesEl.appendChild(el);
    scrollBottom();
  }

  function removeTyping() {
    document.getElementById('typing')?.remove();
  }

  // ── Send message ─────────────────────────────────────────────
  async function sendMessage() {
    if (sending) return;
    const text = inputEl.value.trim();
    if (!text) return;

    chatId = chatIdInput.value.trim() || 'web-test';
    inputEl.value = '';
    inputEl.style.height = 'auto';
    appendMsg(text, 'sent');
    showTyping();
    sending = true;

    try {
      const res  = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, chatId }),
      });
      const data = await res.json();
      removeTyping();

      if (!res.ok) {
        appendMsg('⚠ ' + (data.error || 'Unknown error'), 'received');
      } else {
        appendMsg(data.reply, 'received');
        updateStatusLine(data.provider);
      }
    } catch (err) {
      removeTyping();
      appendMsg('⚠ Network error — is the server running?', 'received');
    } finally {
      sending = false;
      await refreshSession();
    }
  }

  function sendCommand(cmd) {
    inputEl.value = cmd;
    sendMessage();
  }

  // ── Auto-resize textarea ─────────────────────────────────────
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  });

  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  // ── Profile & memory ─────────────────────────────────────────
  async function refreshSession() {
    chatId = chatIdInput.value.trim() || 'web-test';
    try {
      const res     = await fetch(`/api/session/${encodeURIComponent(chatId)}`);
      const session = await res.json();
      populateSidebar(session);
    } catch { /* server may not be ready */ }
  }

  function populateSidebar({ profile = {}, history = [] }) {
    document.getElementById('cfgName').value     = profile.name     || '';
    document.getElementById('cfgShop').value     = profile.shopName || '';
    document.getElementById('cfgLocation').value = profile.location || '';

    // Memory block
    const lines = [];
    if (profile.name)      lines.push(`👤 <span>${esc(profile.name)}</span>`);
    if (profile.shopName)  lines.push(`🏪 <span>${esc(profile.shopName)}</span>`);
    if (profile.location)  lines.push(`📍 <span>${esc(profile.location)}</span>`);
    if (profile.firstSeen) lines.push(`📅 First: <span>${esc(profile.firstSeen)}</span>`);
    if (profile.lastSeen)  lines.push(`🕐 Last: <span>${esc(profile.lastSeen)}</span>`);
    lines.push(`💬 History: <span>${history.length} message(s)</span>`);
    document.getElementById('memoryBlock').innerHTML =
      lines.length ? lines.join('<br>') : 'No data yet.';

    // Notes
    const notes = profile.notes || [];
    const notesList    = document.getElementById('notesList');
    const notesSection = document.getElementById('notesSection');
    notesList.innerHTML = '';
    if (notes.length) {
      notesSection.style.display = '';
      notes.forEach((n, i) => {
        const li = document.createElement('li');
        li.innerHTML = `<span>${esc(n)}</span>
          <button class="del-note" title="Remove" onclick="delNote(${i + 1})">✕</button>`;
        notesList.appendChild(li);
      });
    } else {
      notesSection.style.display = 'none';
    }
  }

  async function saveProfile() {
    chatId = chatIdInput.value.trim() || 'web-test';
    const updates = {
      chatId,
      name:      document.getElementById('cfgName').value.trim() || undefined,
      shopName:  document.getElementById('cfgShop').value.trim() || undefined,
      location:  document.getElementById('cfgLocation').value.trim() || undefined,
    };
    Object.keys(updates).forEach(k => updates[k] === undefined && delete updates[k]);
    await fetch('/api/profile', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(updates),
    });
    showToast('Profile saved ✓');
    await refreshSession();
  }

  async function addNote() {
    const note = document.getElementById('cfgNote').value.trim();
    if (!note) return;
    chatId = chatIdInput.value.trim() || 'web-test';
    await fetch('/api/profile', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chatId, note }),
    });
    document.getElementById('cfgNote').value = '';
    showToast('Note added ✓');
    await refreshSession();
  }

  async function delNote(index) {
    chatId = chatIdInput.value.trim() || 'web-test';
    await fetch('/api/note', {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chatId, index }),
    });
    showToast('Note removed');
    await refreshSession();
  }

  async function resetChat(full) {
    chatId = chatIdInput.value.trim() || 'web-test';
    const label = full ? 'Forget all memory?' : 'Clear conversation history?';
    if (!confirm(label)) return;
    await fetch('/api/reset', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chatId, full }),
    });
    messagesEl.innerHTML = '';
    if (emptyState) { emptyState.style.display = ''; messagesEl.appendChild(emptyState); }
    showToast(full ? 'All memory erased' : 'History cleared');
    await refreshSession();
  }

  function updateStatusLine(provider) {
    const el = document.getElementById('statusLine');
    if (provider === 'grok')   el.textContent = 'Powered by Grok';
    if (provider === 'claude') el.textContent = 'Powered by Claude';
  }

  // ── Provider badge & init ────────────────────────────────────
  async function init() {
    try {
      const res    = await fetch('/api/status');
      const status = await res.json();
      const badge  = document.getElementById('providerBadge');
      if (status.primary === 'grok') {
        badge.textContent = 'Grok → Claude';
        badge.className   = 'provider-badge';
      } else if (status.primary === 'claude') {
        badge.textContent = 'Claude';
        badge.className   = 'provider-badge claude';
      } else {
        badge.textContent = 'No key';
        badge.className   = 'provider-badge none';
      }
    } catch { /* server starting */ }
    await refreshSession();
  }

  chatIdInput.addEventListener('change', refreshSession);
  init();
</script>
</body>
</html>
