name: Deploy TinaAi Telegram Bot to ServerAvatar

on:
  workflow_dispatch:
  push:
    branches:
      - claude/tinaai-github-folder-5iokh7
    paths:
      - 'TinaAi/telegram/**'

jobs:
  deploy:
    name: Deploy to Server via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Deploy TinaAi via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 136.244.100.92
          username: tinaaiuser
          password: ${{ secrets.SSH_PASSWORD }}
          request_pty: true
          script: |
            set -e
            REPO_DIR="/home/tinaaiuser/duka-credit"
            BOT_DIR="$REPO_DIR/TinaAi/telegram"
            BRANCH="claude/tinaai-github-folder-5iokh7"

            echo "→ Updating code..."
            if [ -d "$REPO_DIR/.git" ]; then
              cd "$REPO_DIR"
              git fetch origin "$BRANCH"
              git reset --hard "origin/$BRANCH"
            else
              git clone --branch "$BRANCH" \
                https://github.com/KDee82/duka-credit.git "$REPO_DIR"
            fi

            echo "→ Installing dependencies..."
            cd "$BOT_DIR"
            npm install --omit=dev

            echo "→ Writing .env..."
            cat > .env <<ENVEOF
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            GROK_API_KEY=${{ secrets.GROK_API_KEY }}
            CLAUDE_API_KEY=${{ secrets.CLAUDE_API_KEY }}
            ENVEOF

            echo "→ Starting bot with PM2..."
            command -v pm2 || npm install -g pm2
            if pm2 describe tinaai > /dev/null 2>&1; then
              pm2 restart tinaai
            else
              pm2 start "$BOT_DIR/bot.js" --name tinaai
            fi
            pm2 save
            echo "✅ TinaAi deployed and running!"
