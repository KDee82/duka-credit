name: Deploy TinaAi Telegram Bot to ServerAvatar

on:
  workflow_dispatch:   # manual trigger from GitHub Actions tab
  push:
    branches:
      - claude/tinaai-github-folder-5iokh7
    paths:
      - 'TinaAi/telegram/**'

jobs:
  deploy:
    name: Deploy to ServerAvatar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: TinaAi/telegram/package-lock.json

      - name: Install dependencies
        working-directory: TinaAi/telegram
        run: npm install

      - name: Deploy to ServerAvatar
        working-directory: TinaAi/telegram
        env:
          SERVERAVATAR_TOKEN: ${{ secrets.SERVERAVATAR_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: node deploy.js
