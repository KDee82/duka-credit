name: Deploy TinaAi Telegram Bot to ServerAvatar

on:
  workflow_dispatch:
  push:
    branches:
      - claude/tinaai-github-folder-5iokh7
    paths:
      - 'TinaAi/telegram/**'

jobs:
  deploy:
    name: Deploy to ServerAvatar
    runs-on: ubuntu-latest

    steps:
      - name: Trigger ServerAvatar deployment
        run: |
          WEBHOOK="${{ secrets.DEPLOY_WEBHOOK_URL }}"
          WEBHOOK="${WEBHOOK:-https://api.serveravatar.com/webhooks/git-deployments/P6fz3fmZN2e9TVSjas8jftl8Toaa1sde}"
          echo "Posting to webhook..."
          HTTP_CODE=$(curl -s -o /tmp/webhook_response.txt -w "%{http_code}" -X POST "$WEBHOOK")
          echo "Response (HTTP $HTTP_CODE):"
          cat /tmp/webhook_response.txt
          echo ""
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Deployment triggered successfully"
          else
            echo "✗ Webhook returned HTTP $HTTP_CODE"
            exit 1
          fi
