version: '3.9'

# Local development: only infrastructure services
# Run apps with: pnpm dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: ledgerpilot-db-dev
    environment:
      POSTGRES_USER: ledgerpilot
      POSTGRES_PASSWORD: ledgerpilot_dev
      POSTGRES_DB: ledgerpilot_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ledgerpilot-redis-dev
    ports:
      - "6379:6379"

  mailhog:
    image: mailhog/mailhog
    container_name: ledgerpilot-mail
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_dev_data:
