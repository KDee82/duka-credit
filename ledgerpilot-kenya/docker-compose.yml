version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ledgerpilot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ledgerpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledgerpilot_dev}
      POSTGRES_DB: ${POSTGRES_DB:-ledgerpilot}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ledgerpilot}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ledgerpilot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ledgerpilot-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - apps/api/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ledgerpilot}:${POSTGRES_PASSWORD:-ledgerpilot_dev}@postgres:5432/${POSTGRES_DB:-ledgerpilot}
      REDIS_URL: redis://redis:6379
    ports:
      - "3001:3001"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: ledgerpilot-web
    restart: unless-stopped
    depends_on:
      - api
    env_file:
      - apps/web/.env
    environment:
      NEXT_PUBLIC_API_URL: http://api:3001/api/v1
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
